---
layout: default
---
<header class="top">
  <div class="top-inner">
    {% include nav.html %}
    {% if page.eyebrow %}<div class="eyebrow"><span class="dot"></span>{{ page.eyebrow }}</div>{% endif %}
    <h1 class="title">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
  </div>
</header>

<div class="app">
  <article class="prose">
    {{ content }}
  </article>
</div>
