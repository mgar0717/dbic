name: Build Floating Calculator APK

on:
  push:
    branches:
      - "claude/floating-transparent-calculator-app-89rczg"
    paths:
      - "android/FloatingCalculator/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android/FloatingCalculator
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatingCalculator-debug-apk
          path: android/FloatingCalculator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit APK back to repository
        run: |
          mkdir -p android/FloatingCalculator/dist
          cp android/FloatingCalculator/app/build/outputs/apk/debug/app-debug.apk \
             android/FloatingCalculator/dist/FloatingCalculator-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/FloatingCalculator/dist/FloatingCalculator-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "ci: build debug APK [skip ci]"
            git push
          else
            echo "APK unchanged, skipping commit"
          fi
